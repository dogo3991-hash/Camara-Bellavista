appId: com.slmbellavista.camararomana
productName: SLM Camara Romana
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
win:
  executableName: SLM-Camara-Romana
  target: nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
publish:
  provider: github
  owner: dogo3991-hash
  repo: Camara-Bellavista
  releaseType: release
